# ==========================================================
# MDVCrates 1.2.2
# ==========================================================

settings:
  interaction-hand: MAIN_HAND
  require-free-slot: true
  prevent-double-chests: true
  max-open-distance: 9.0
  deliver-pending-on-join-delay-ticks: 20

editor:
  size: 54
  # Cantidad de recompensas visibles por página. Máximo 45 con inventario de 54.
  rewards-per-page: 45
  # Compatibilidad con configs viejas; solo se usa si falta rewards-per-page.
  reward-slots: 45
  default-new-item-weight: 10.0
  show-command-rewards: true

idle-engine:
  # El motor puede correr cada tick. Cada Ring/Orbit/Random Point tiene además
  # su propio interval-ticks para bajar individualmente la frecuencia.
  tick-interval: 1
  max-view-distance: 24.0

# Se usa si la crate no define viewer: propio.
default-viewer:
  title: "&8Recompensas: {display-name}"
  show-percentages: true

# Holograma/nombre visible encima de cada crate.
# Puede sobrescribirse por crate con name-display:.
default-name-display:
  enabled: true
  text: "{display-name}"
  offset:
    x: 0.5
    y: 1.85
    z: 0.5
  billboard: CENTER
  shadowed: true
  see-through: false
  default-background: false
  line-width: 200
  view-range: 1.0
  hide-during-opening: false

# Holograma/nombre visible encima de cada crate, y debajo de su nombre.
below-name-display:
  enabled: true
  text: "Click izquierdo para previsualizar."
  offset:
    x: 0.5
    y: 1.2
    z: 0.5
  billboard: CENTER
  shadowed: true
  see-through: false
  default-background: false
  line-width: 200
  view-range: 1.0
  hide-during-opening: true
  max-distance: 4.0

# Mensaje broadcast cuando alguien abre una crate.
# Placeholders: {player} y {display-name}
# Puede sobrescribirse por crate con broadcast:.
default-broadcast:
  enabled: true
  text: "{player} ha abierto una {display-name}."
  sound: ENTITY_PLAYER_LEVELUP
  sound-enabled: true


# Si una crate no tiene su bloque animations:, usa este preset.
default-animations:
  idle:
    enabled: true

    # ======================================================
    # ITEM DISPLAYS ESTÁTICOS (1.2.2)
    # ======================================================
    # Sirve para colocar objetos/bloques visuales encima o alrededor
    # de la crate. El offset parte de la esquina inferior del bloque,
    # igual que name-display y roll.display-offset.
    #
    # También puede usar MMOItems con mmoitems-type + mmoitems-id.
    #
    # opening-movement mueve el MISMO ItemDisplay durante la apertura.
    # offset.y: 1.0 + duration-ticks: 20 = sube 1 bloque en 1 segundo.
    item-displays:
      crystal_example:
        enabled: false
        material: AMETHYST_CLUSTER
        offset:
          x: 0.5
          y: 1.55
          z: 0.5
        size: 0.65
        # También puedes usar scale.x/y/z si no quieres escala uniforme.
        transform: FIXED
        billboard: FIXED
        view-range: 1.0
        # 1 suaviza el movimiento por teleports sin agregar delay perceptible.
        teleport-duration-ticks: 1
        shadow-radius: 0.0
        shadow-strength: 0.0
        hide-during-opening: false
        opening-movement:
          enabled: true
          delay-ticks: 0
          duration-ticks: 20
          curve: LINEAR
          offset:
            x: 0.0
            y: 1.0
            z: 0.0

    # Los idle NO se apagan durante opening.
    rings:
      ring1:
        enabled: true
        particle: END_ROD
        # Frecuencia propia del efecto.
        interval-ticks: 2
        radius: 1.05
        y-offset: 0.55
        # Puntos dibujados del anillo cada ejecución.
        points: 18
        # Cantidad de partículas Bukkit por cada punto.
        count: 1
        spread: 0.0
        # Velocidad propia de la partícula Bukkit. 0.0 = sin impulso extra.
        # `extra` sigue siendo compatible como nombre antiguo.
        particle-speed: 0.0

        # Desplazamiento fijo del centro del ring respecto a la crate.
        center-offset:
          x: 0.0
          y: 0.0
          z: 0.0

        # Mueve TODO el ring alrededor de la crate en el plano horizontal.
        # El plano/orientación del ring se mantiene fijo salvo que uses
        # plane-rotation-deg-per-tick. Dos rings opuestos pueden usar
        # phase-deg 0 y 180.
        center-orbit:
          enabled: false
          radius: 1.10
          speed-deg-per-tick: -2.0
          phase-deg: 0.0
          y-offset: 0.0

        phase-speed-deg-per-tick: 2.5
        tilt-deg:
          x: 0.0
          y: 0.0
          z: 0.0
        plane-rotation-deg-per-tick:
          x: 0.25
          y: 0.0
          z: 0.45

    orbits:
      orbit1:
        enabled: true
        particle: ENCHANT
        interval-ticks: 2

        # Si agregas item-display:, la órbita deja de generar partículas
        # y mueve el MISMO ItemDisplay por la trayectoria.
        # Ideal para cubitos de CALCITE/GOLD_BLOCK, cristales, MMOItems, etc.
        # item-display:
        #   enabled: true
        #   material: CALCITE
        #   size: 0.14
        #   transform: FIXED
        #   billboard: FIXED
        #   view-range: 1.0
        #   teleport-duration-ticks: 1
        #   hide-during-opening: false
        #   opening-movement:
        #     enabled: false
        #     delay-ticks: 0
        #     duration-ticks: 20
        #     curve: LINEAR
        #     offset:
        #       x: 0.0
        #       y: 1.0
        #       z: 0.0

        # Cantidad de "lunas" distribuidas en la órbita.
        orbiters: 3
        radius: 1.30
        y-offset: 0.60
        count: 1
        spread: 0.0
        particle-speed: 0.0
        angular-speed-deg-per-tick: 4.0
        # Posición inicial en grados; útil para separar displays en rutas iguales.
        phase-deg: 0.0
        random-plane: true
        tilt-deg:
          x: 25.0
          y: 0.0
          z: 35.0
        plane-rotation-deg-per-tick:
          x: 0.15
          y: 0.20
          z: 0.10

    # Nuevo efecto 1.1.0: partículas en ubicaciones aleatorias alrededor
    # de la crate. Se pueden declarar tantos grupos como quieras.
    random-points:
      ambient1:
        enabled: true
        particle: SOUL_FIRE_FLAME
        interval-ticks: 5
        # Cuántas ubicaciones aleatorias se generan en cada intervalo.
        points-per-spawn: 1
        # SPHERE o CYLINDER.
        shape: SPHERE
        radius: 1.45
        vertical-radius: 0.85
        center-y-offset: 0.45
        # true = solamente sobre la superficie del volumen.
        surface-only: false
        # Partículas Bukkit en cada ubicación aleatoria.
        count: 1
        spread: 0.0
        particle-speed: 0.0

  opening:
    suction:
      enabled: true
      particle: SOUL_FIRE_FLAME
      radius: 1.50
      center-y-offset: 0.55

      # 1 = cada tick, 2 = cada 2 ticks, 4 = cada 4 ticks, etc.
      spawn-interval-ticks: 3
      # Cuántos motes nuevos nacen CADA intervalo.
      motes-per-spawn: 1

      travel-ticks-min: 8
      travel-ticks-max: 14
      # Cantidad de partículas Bukkit dibujadas por mote/posición.
      count: 1
      spread: 0.0
      particle-speed: 0.0

    roll:
      steps: 18
      initial-delay-ticks: 2
      final-delay-ticks: 12
      curve: EASE_IN_QUAD
      display-offset:
        x: 0.5
        y: 1.45
        z: 0.5
      name-offset-y: 0.55
      show-name: true
      display-scale: 0.85
      spin-deg-per-tick: 10.0
      change-sound: BLOCK_NOTE_BLOCK_HAT
      change-sound-volume: 0.55
      change-sound-pitch: 1.55

    finish:
      pause-before-burst-ticks: 8
      rise-ticks: 12
      rise-height: 0.90
      burst-particle: EXPLOSION
      burst-count: 1
      burst-spread: 0.0
      # Igual que particle-speed, pero para el burst final.
      # `burst-extra` sigue funcionando por compatibilidad.
      burst-particle-speed: 0.0
      reward-sound: ENTITY_PLAYER_LEVELUP
      reward-sound-volume: 1.0
      reward-sound-pitch: 1.15
      close-delay-ticks: 4
