# Caja de la Eternidad - ejemplo BlockDisplay real
animations:

  idle:

    enabled: true

    block-displays:

      cristal_eternidad:

        enabled: true

        material: AMETHYST_CLUSTER

        offset:
          x: 0.5
          y: 1.55
          z: 0.5

        size: 0.65

        billboard: FIXED

        view-range: 1.0
        teleport-duration-ticks: 1

        shadow-radius: 0.0
        shadow-strength: 0.0

        hide-during-opening: false

        opening-movement:

          enabled: true

          delay-ticks: 0
          duration-ticks: 20

          curve: LINEAR

          offset:
            x: 0.0
            y: 1.0
            z: 0.0

    orbits:

      eternidad_calcita_1:

        enabled: true

        orbiters: 1

        radius: 1.05
        y-offset: -0.05

        angular-speed-deg-per-tick: 2.4
        phase-deg: 0.0

        random-plane: false

        tilt-deg:
          x: 55.0
          y: 0.0
          z: 20.0

        plane-rotation-deg-per-tick:
          x: 0.0
          y: 0.0
          z: 0.0

        block-display:

          enabled: true

          material: CALCITE

          size: 0.14

          billboard: FIXED

          view-range: 1.0
          teleport-duration-ticks: 1

          hide-during-opening: false
